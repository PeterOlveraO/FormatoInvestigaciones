# APA 7, trabajo estudiantil.
# Idioma del documento por omisión; el perfil o --doc-lang pueden cambiarlo.
language = "es"
# Opciones de \documentclass: tamaño de letra y papel.
class_options = "12pt, letterpaper"
# Estructura recomendada: el programa avisa si falta un encabezado.
headings = ["Introducción", "Desarrollo", "Conclusión", "Referencias"]
# Lo mismo para documentos en inglés (vacío = no se revisa).
headings_en = ["Introduction", "Development", "Conclusion", "References"]
