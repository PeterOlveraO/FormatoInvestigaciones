[package]
name = "investigacion"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Generates academic papers in PDF from Markdown and an APA LaTeX template."
license = "GPL-3.0-or-later"
readme = "README.md"
default-run = "investigacion"

[[bin]]
name = "investigacion"
path = "src/main.rs"

[[bin]]
name = "investigacion-tui"
path = "src/bin/investigacion-tui.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
opener = "0.8"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
unicode-normalization = "0.1"

[profile.release]
# Binario pequeño y rápido de arrancar; el tiempo real lo gastan Pandoc y pdflatex.
lto = "thin"
codegen-units = 1
strip = true
