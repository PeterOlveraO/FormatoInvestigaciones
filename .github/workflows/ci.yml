# Compila y prueba en Linux y en Windows en cada push y PR.
# En Linux se instala TeX, así que también se generan PDFs de verdad;
# en Windows las pruebas de PDF se saltan solas (no hay pdflatex).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc graphviz \
            texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra \
            texlive-lang-spanish texlive-pictures texlive-plain-generic
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress pandoc graphviz
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Las fallas también salen como anotación, que se ve sin iniciar sesión.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee test.log || {
            grep -E -A25 "^---- |panicked" test.log | head -200 \
              | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' \
              | sed -e 's/^/::error title=cargo test::/'; echo
            exit 1
          }
