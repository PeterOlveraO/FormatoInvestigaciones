# Example course profile. Copy this file with a short name for your course
# (for example `ia.toml`) and use it with `investigacion Tarea1.md -p ia --title "..."`
# or pick it in the interactive menu.

# Course name as shown on the cover (required).
name = "Nombre de la materia"

# Optional: when missing, the .env values are used; if those are missing too,
# the line does not appear on the cover.
teacher = "Nombre del docente"
group = "7-A"
# members = "Ana Ruiz, Luis Paz"

# Template from templates/ (apa, apa-simple...). Empty = apa.
template = "apa"

# Subfolder of input/ with this course's papers. The PDF goes to the same
# subfolder of output/ (output/IA/...).
folder = "IA"
